[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pova-assistant"
version = "1.0.0"
description = "A secure Windows desktop voice assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.setuptools]
py-modules = ["main", "command"]

[tool.setuptools.packages.find]
where = ["."]
include = ["actions*", "config*", "core*", "ui*", "utils*", "voice*"]
